services:
  - type: web
    name: mispha-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3002
      - key: NODE_ENV
        value: production
      # The rest (DATABASE_URL, SUPABASE_URL, etc.) must be set in the Render dashboard!
